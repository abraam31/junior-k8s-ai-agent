# Placeholder RBAC: read-only access to pods and pod logs, scoped to a single
# target namespace (the namespace Junior watches, not necessarily the one it
# runs in). Adjust `namespace` below to the namespace you want Junior to triage.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-agent-readonly
  namespace: sandbox
  labels:
    app.kubernetes.io/name: devops-agent-sa
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-agent-readonly
  namespace: sandbox
  labels:
    app.kubernetes.io/name: devops-agent-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devops-agent-readonly
subjects:
  - kind: ServiceAccount
    name: devops-agent-sa
    namespace: sandbox
