# Placeholder RBAC: read-only access to pods and pod logs, scoped to a single
# target namespace (the namespace Junior watches, not necessarily the one it
# runs in). Adjust `namespace` below to the namespace you want Junior to triage.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: junior-readonly
  namespace: sandbox
  labels:
    app.kubernetes.io/name: junior
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: junior-readonly
  namespace: sandbox
  labels:
    app.kubernetes.io/name: junior
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: junior-readonly
subjects:
  - kind: ServiceAccount
    name: junior
    namespace: junior
