# Secret exists but the referenced key does not -> CreateContainerConfigError
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: sandbox
stringData:
  stripe-key: sk_test_dummy
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-secret-key
  namespace: sandbox
spec:
  containers:
    - name: payments
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: PAYPAL_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: paypal-key
