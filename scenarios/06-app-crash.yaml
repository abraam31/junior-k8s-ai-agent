# Application fails on startup with a clear log line -> Error exit 1, CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata:
  name: app-crash
  namespace: sandbox
spec:
  containers:
    - name: orders
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "starting orders service v2.3.1"
          echo "connecting to postgres at orders-db:5432"
          sleep 2
          echo "FATAL: could not connect to server: Connection refused (orders-db:5432)"
          exit 1
