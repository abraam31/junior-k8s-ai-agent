# Env var references a Secret that does not exist -> CreateContainerConfigError
apiVersion: v1
kind: Pod
metadata:
  name: missing-secret
  namespace: sandbox
spec:
  containers:
    - name: api
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
