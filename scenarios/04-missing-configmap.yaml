# envFrom references a ConfigMap that does not exist -> CreateContainerConfigError
apiVersion: v1
kind: Pod
metadata:
  name: missing-configmap
  namespace: sandbox
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: worker-config
